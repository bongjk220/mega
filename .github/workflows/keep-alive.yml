name: Keep Render App Alive

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = KST 08:00
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Render app awake
        run: |
          curl -f https://megatestkr.onrender.com/ || true
        continue-on-error: true
