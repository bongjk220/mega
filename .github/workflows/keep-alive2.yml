name: Keep Render App Alive2

on:
  schedule:
    # 매 12분마다 실행 (한국 시간으로 자동 변환됨)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Render app awake2
        run: |
          curl -f https://dadream.onrender.com/ || true
        continue-on-error: true
